name: Build OpenWrt - K2

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: k2.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: namespace-profile-dgfkjdzv

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # git.io 短链已停用,直接装 OpenWrt 官方 ubuntu-22.04 编译依赖
        sudo -E apt-get -qq install build-essential clang flex bison gperf gawk \
          git-lfs libelf-dev libssl-dev libncurses-dev autoconf automake \
          jq rsync unzip wget zip zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT "$PWD"
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Cache build artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          openwrt/build_dir
          openwrt/staging_dir
          openwrt/dl
        key: k2-build-${{ hashFiles('k2.config', 'diy-part1.sh', 'diy-part2.sh') }}
        restore-keys: |
          k2-build-

    - name: Load custom feeds
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH connection to Actions
      if: false
      run: echo "SSH debug action disabled for least-privilege K2 builds"

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        JOBS=$(($(nproc)-1))
        [ "$JOBS" -lt 1 ] && JOBS=1
        echo -e "$(nproc) thread compile (using ${JOBS} jobs to avoid OOM)"
        make -j"$JOBS" || make -j1 V=sc
        if ! find bin/targets -type f \( -name '*sysupgrade.bin' -o -name '*factory.bin' \) | grep -q .; then
          echo "::error::No flashable firmware image produced under bin/targets"
          find bin/targets -maxdepth 3 -type f -print || true
          exit 1
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        target_dir=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)
        [ -n "$target_dir" ] && [ -d "$target_dir" ] || { echo "::error::target directory missing"; exit 1; }
        rm -rf -- "$target_dir/packages"
        echo "FIRMWARE=$target_dir" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      if: false
      run: echo "Cowtransfer upload disabled to avoid curl-pipe-shell remote execution"

    - name: Upload firmware to WeTransfer
      if: false
      run: echo "WeTransfer upload disabled to avoid curl-pipe-shell remote execution"

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        touch release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      if: false
      run: echo "Release upload disabled for least-privilege K2 builds"

    - name: Delete workflow runs
      if: false
      run: echo "Delete workflow runs disabled for least-privilege K2 builds"

    - name: Remove old Releases
      if: false
      run: echo "Old release cleanup disabled for least-privilege K2 builds"
